<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Wortuhr Bildschirmschoner</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none;-webkit-tap-highlight-color:transparent;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.frame{
  --s:min(34vw,34vh,340px);--off:#2a2d32;--on:#f4f1e8;--glow:rgba(244,241,232,.55);
  position:absolute;left:0;top:0;width:var(--s);aspect-ratio:1;background:#15171a;border-radius:calc(var(--s)*.03);
  padding:calc(var(--s)*.075);opacity:0;
  box-shadow:0 calc(var(--s)*.03) calc(var(--s)*.08) rgba(0,0,0,.35);
}
.grid{width:100%;height:100%;display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(10,1fr);
  font-size:calc(var(--s)*.056);font-weight:600;user-select:none;-webkit-user-select:none}
.grid span{display:flex;align-items:center;justify-content:center;color:var(--off);transition:color .8s ease,text-shadow .8s ease}
.grid span.on{color:var(--on);text-shadow:0 0 .5em var(--glow)}
.dot{position:absolute;width:calc(var(--s)*.022);height:calc(var(--s)*.022);border-radius:50%;background:var(--off);transition:background .8s,box-shadow .8s}
.dot.on{background:var(--on);box-shadow:0 0 .8em var(--glow)}
.d0{left:calc(var(--s)*.03);top:calc(var(--s)*.03)}
.d1{right:calc(var(--s)*.03);top:calc(var(--s)*.03)}
.d2{right:calc(var(--s)*.03);bottom:calc(var(--s)*.03)}
.d3{left:calc(var(--s)*.03);bottom:calc(var(--s)*.03)}
@media (prefers-reduced-motion:reduce){.grid span,.dot{transition:none}}
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="grid" id="grid"></div>
  <i class="dot d0"></i><i class="dot d1"></i><i class="dot d2"></i><i class="dot d3"></i>
</div>
<script>
/* =====================  EINSTELLUNGEN (nur hier im Code)  ===================== */
const LANG = "sw";        /* Sprache: "de" Deutsch · "sw" Schwäbisch · "en" English · "fr" Français */
const SHOW_SECONDS = 30;  /* so lange bleibt die Uhr an einer Stelle sichtbar */
const FADE_SECONDS = 2;   /* Ein- und Ausblenden */
const PAUSE_SECONDS = 1;  /* Pause im Dunkeln, bevor sie woanders auftaucht */
const MIN_JUMP = 0.45;    /* Mindestabstand zur letzten Stelle (Anteil der möglichen Strecke, 0–1) */
const REMEMBER = 6;       /* so viele letzte Stellen werden gemerkt und gemieden */
/* ============================================================================= */

const hours=(n)=>"h"+n;
const L={};

/* Muster nach den originalen QLOCKTWO-Frontplatten. Wort = [Zeile, Spalte, Länge] */
/* ---------- Sprachen ---------- */
L.de={rows:["ESKISTAFÜNF","ZEHNZWANZIG","DREIVIERTEL","VORFUNKNACH","HALBAELFÜNF","EINSXAMZWEI","DREIPMJVIER","SECHSNLACHT","SIEBENZWÖLF","ZEHNEUNKUHR"],
W:{ES:[0,0,2],IST:[0,3,3],MF:[0,7,4],MZ:[1,0,4],ZWANZIG:[1,4,7],DREI:[2,0,4],VIERTEL:[2,4,7],VOR:[3,0,3],NACH:[3,7,4],HALB:[4,0,4],
 h1:[5,0,4],h1e:[5,0,3],h2:[5,7,4],h3:[6,0,4],h4:[6,7,4],h5:[4,7,4],h6:[7,0,5],h7:[8,0,6],h8:[7,7,4],h9:[9,3,4],h10:[9,0,4],h11:[4,5,3],h12:[8,6,5],UHR:[9,8,3]},
f(H,M){const q=M/5|0,w=["ES","IST"];let h=H%12||12;if(q>=5)h=h%12+1;
 const t=[[ "UHR"],["MF","NACH"],["MZ","NACH"],["VIERTEL","NACH"],["ZWANZIG","NACH"],["MF","VOR","HALB"],["HALB"],["MF","NACH","HALB"],["ZWANZIG","VOR"],["DREI","VIERTEL"],["MZ","VOR"],["MF","VOR"]][q];
 return w.concat(t,h===1&&q===0?"h1e":hours(h));}};

L.sw={rows:["ESKISCHFUNK","DREIVIERTLA","ZEHNBIEFÜNF","NACHGERTVOR","HALBXFÜNFEI","OISECHSELFE","ZWOIEACHTED","DREIEZWÖLFE","ZEHNEUNEUHL","SIEBNEVIERE"],
W:{ES:[0,0,2],ISCH:[0,3,4],DREI:[1,0,4],VIERTL:[1,4,6],MZ:[2,0,4],MF:[2,7,4],NACH:[3,0,4],VOR:[3,8,3],HALB:[4,0,4],
 h1:[5,0,3],h2:[6,0,5],h3:[7,0,5],h4:[9,6,5],h5:[4,5,4],h6:[5,2,5],h7:[9,0,6],h8:[6,5,5],h9:[8,3,5],h10:[8,0,5],h11:[5,7,4],h12:[7,5,6]},
f(H,M){const q=M/5|0;let h=H%12||12;if(q>=4)h=h%12+1;
 const t=[[],["MF","NACH"],["MZ","NACH"],["VIERTL","NACH"],["MZ","VOR","HALB"],["MF","VOR","HALB"],["HALB"],["MF","NACH","HALB"],["MZ","NACH","HALB"],["DREI","VIERTL"],["MZ","VOR"],["MF","VOR"]][q];
 return ["ES","ISCH"].concat(t,hours(h));}};

L.en={rows:["ITLISASAMPM","ACQUARTERDC","TWENTYFIVEX","HALFSTENFTO","PASTERUNINE","ONESIXTHREE","FOURFIVETWO","EIGHTELEVEN","SEVENTWELVE","TENSEOCLOCK"],
W:{IT:[0,0,2],IS:[0,3,2],A:[1,0,1],QUARTER:[1,2,7],TWENTY:[2,0,6],MF:[2,6,4],HALF:[3,0,4],MT:[3,5,3],TO:[3,9,2],PAST:[4,0,4],OCLOCK:[9,5,6],
 h1:[5,0,3],h2:[6,8,3],h3:[5,6,5],h4:[6,0,4],h5:[6,4,4],h6:[5,3,3],h7:[8,0,5],h8:[7,0,5],h9:[4,7,4],h10:[9,0,3],h11:[7,5,6],h12:[8,5,6]},
f(H,M){const q=M/5|0;let h=H%12||12;if(q>=7)h=h%12+1;
 const t=[["OCLOCK"],["MF","PAST"],["MT","PAST"],["A","QUARTER","PAST"],["TWENTY","PAST"],["TWENTY","MF","PAST"],["HALF","PAST"],["TWENTY","MF","TO"],["TWENTY","TO"],["A","QUARTER","TO"],["MT","TO"],["MF","TO"]][q];
 return ["IT","IS"].concat(t,hours(h));}};

L.fr={rows:["ILNESTODEUX","QUATRETROIS","NEUFUNESEPT","HUITSIXCINQ","MIDIXMINUIT","ONZERHEURES","MOINSOLEDIX","ETRQUARTPMD","VINGT-CINQU","ETSDEMIEPAM"],
W:{IL:[0,0,2],EST:[0,3,3],
 h1:[2,4,3],h2:[0,7,4],h3:[1,6,5],h4:[1,0,6],h5:[3,7,4],h6:[3,4,3],h7:[2,7,4],h8:[3,0,4],h9:[2,0,4],h10:[4,2,3],h11:[5,0,4],
 MIDI:[4,0,4],MINUIT:[4,5,6],HEURE:[5,5,5],HEURES:[5,5,6],
 MOINS:[6,0,5],LE:[6,6,2],MDIX:[6,8,3],ETQ:[7,0,2],QUART:[7,3,5],VINGT:[8,0,5],TIRET:[8,5,1],MCINQ:[8,6,4],ETD:[9,0,2],DEMIE:[9,3,5]},
f(H,M){const q=M/5|0;let h=(H+(q>=7?1:0))%24;
 const w=["IL","EST"];
 if(h===0)w.push("MINUIT");else if(h===12)w.push("MIDI");else{const n=h%12;w.push("h"+n,n===1?"HEURE":"HEURES");}
 const t=[[],["MCINQ"],["MDIX"],["ETQ","QUART"],["VINGT"],["VINGT","TIRET","MCINQ"],["ETD","DEMIE"],["MOINS","VINGT","TIRET","MCINQ"],["MOINS","VINGT"],["MOINS","LE","QUART"],["MOINS","MDIX"],["MOINS","MCINQ"]][q];
 return w.concat(t);}};
/* ---------- Ende Sprachen ---------- */

const lg=L[LANG]||L.de;
document.documentElement.lang={de:"de",sw:"de",en:"en",fr:"fr"}[LANG]||"de";

const frame=document.getElementById("frame"),grid=document.getElementById("grid"),dots=[...document.querySelectorAll(".dot")];
const cells=[];for(let i=0;i<110;i++){const s=document.createElement("span");grid.appendChild(s);cells.push(s)}
lg.rows.forEach((r,y)=>[...r].forEach((ch,x)=>cells[y*11+x].textContent=ch));
function render(){
  const d=new Date(),on=new Set();
  lg.f(d.getHours(),d.getMinutes()).forEach(k=>{const p=lg.W[k];if(!p)return;const[r,c,l]=p;for(let i=0;i<l;i++)on.add(r*11+c+i)});
  cells.forEach((s,i)=>s.classList.toggle("on",on.has(i)));
  const e=d.getMinutes()%5;dots.forEach((x,i)=>x.classList.toggle("on",i<e));
}
render();setInterval(render,1000);

/* ---------- Auftauchen an wechselnden Stellen ---------- */
frame.style.transition="opacity "+FADE_SECONDS+"s ease";
const history=[]; /* letzte Stellen (links/oben) */

function range(){return{mx:Math.max(0,innerWidth-frame.offsetWidth),my:Math.max(0,innerHeight-frame.offsetHeight)}}

/* Zufällige Stelle, die weit weg von der letzten und von den zuletzt benutzten Stellen liegt */
function pickSpot(){
  const{mx,my}=range(),span=Math.hypot(mx,my)||1,w=frame.offsetWidth;
  const minLast=MIN_JUMP*span,minHist=Math.min(w*.9,span*.5);
  const dist=(p,q)=>Math.hypot(p.x-q.x,p.y-q.y);
  let best=null,bestScore=-1;
  for(let i=0;i<200;i++){
    const c={x:Math.random()*mx,y:Math.random()*my};
    const dl=history.length?dist(c,history[history.length-1]):Infinity;
    const dh=history.length?Math.min(...history.map(p=>dist(c,p))):Infinity;
    if(dl>=minLast&&dh>=minHist)return c;           /* erste passende Stelle nehmen */
    const score=Math.min(dl/minLast,dh/minHist);    /* sonst die am besten passende merken */
    if(score>bestScore){bestScore=score;best=c}
  }
  return best;
}
function place(){
  const c=pickSpot();
  history.push(c);if(history.length>REMEMBER)history.shift();
  frame.style.transform="translate3d("+Math.round(c.x)+"px,"+Math.round(c.y)+"px,0)";
}
function cycle(){
  place();
  frame.style.opacity="1";                                   /* einblenden */
  setTimeout(()=>{
    frame.style.opacity="0";                                 /* ausblenden */
    setTimeout(cycle,(FADE_SECONDS+PAUSE_SECONDS)*1000);     /* dann woanders neu */
  },(FADE_SECONDS+SHOW_SECONDS)*1000);
}
cycle();

/* Bei Größenänderung (Drehen) sofort neu platzieren, damit die Uhr im Bild bleibt */
addEventListener("resize",()=>{history.length=0;place()});

/* Bildschirm anlassen (wo unterstützt) */
let lock=null;
async function keepAwake(){try{if("wakeLock"in navigator)lock=await navigator.wakeLock.request("screen")}catch(e){}}
keepAwake();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")keepAwake()});

/* Tippen/Klicken: Vollbild an/aus */
const root=document.documentElement;
document.addEventListener("click",()=>{
  const fs=document.fullscreenElement||document.webkitFullscreenElement;
  try{
    if(fs)(document.exitFullscreen||document.webkitExitFullscreen).call(document);
    else if(root.requestFullscreen||root.webkitRequestFullscreen){const p=(root.requestFullscreen||root.webkitRequestFullscreen).call(root);if(p&&p.catch)p.catch(()=>{})}
  }catch(e){}
});
</script>
</body>
</html>
